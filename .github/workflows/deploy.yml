name: CI - Insurance Risk App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------
      # Backend validation
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate FastAPI source
        run: |
          python -m py_compile src/api/app.py
          echo "FastAPI source validation passed."

      # -------------------------
      # Frontend validation
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: CI validation complete
        run: |
          echo "======================================"
          echo "Insurance Risk App CI validation PASS"
          echo "Backend syntax: PASS"
          echo "React dependencies: PASS"
          echo "React production build: PASS"
          echo "======================================"